<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#202124;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:360px;
    background:#2b2d31;
    padding:20px;
    border-radius:16px;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}
</style>
</head>

<body>

<div class="card">

<iframe
    data-tally-src="https://tally.so/embed/7R5EDP?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
    loading="lazy"
    width="100%"
    height="234"
    frameborder="0"
    marginheight="0"
    marginwidth="0"
    title="Mon formulaire">
</iframe>

</div>

<script>
var d=document,w="https://tally.so/widgets/embed.js",
v=function(){
    if(typeof Tally!="undefined"){
        Tally.loadEmbeds();
    }else{
        d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function(e){
            e.src=e.dataset.tallySrc;
        });
    }
};

if(typeof Tally!="undefined"){
    v();
}else if(d.querySelector('script[src="'+w+'"]')==null){
    var s=d.createElement("script");
    s.src=w;
    s.onload=v;
    s.onerror=v;
    d.body.appendChild(s);
}
</script>

</body>
</html>
