<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#202124;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:360px;
    background:#2b2d31;
    padding:35px;
    border-radius:16px;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

h1{
    color:#fff;
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#3a3d42;
    color:#fff;
    font-size:15px;
}

input::placeholder{
    color:#bdbdbd;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#ffffff;
    color:#111;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    opacity:.9;
}

a{
    display:block;
    text-align:center;
    color:#cfcfcf;
    margin-top:18px;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="card">
    <h1>Connexion</h1>

    <input type="text" placeholder="Nom d'utilisateur">

    <input type="password" placeholder="Mot de passe">

    <button>Se connecter</button>

    <a href="#">Mot de passe oublié ?</a>
</div>

</body>
</html>
